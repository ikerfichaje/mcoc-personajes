<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Buscador offline de campeones y reliquias de MARVEL Batalla de Superhéroes (fan app).">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MCOC Buscador">
  <title>MCOC Buscador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Campeones</h1>
    <button id="backBtn" class="icon-btn" hidden aria-label="Volver">‹</button>
    <button id="installBtn" class="install-btn" hidden aria-label="Instalar la app en la pantalla de inicio">⤓ Instalar</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/buscar" data-tab="buscar"><span class="ti">⌕</span>Campeones</a>
    <a href="#/ranking" data-tab="ranking"><span class="ti">♛</span>Ranking</a>
    <a href="#/equipo" data-tab="equipo"><span class="ti">⚇</span>Equipo</a>
    <a href="#/reliquias" data-tab="reliquias"><span class="ti">◈</span>Reliquias</a>
    <a href="#/info" data-tab="info"><span class="ti">ⓘ</span>Info</a>
  </nav>

  <script src="data/data.js"></script>
  <script src="data/images.js" onerror="self.MCOC_IMG={}"></script>
  <script src="data/kit-effects.js" onerror="self.MCOC_KITFX={}"></script>
  <script src="js/app.js"></script>
</body>
</html>
